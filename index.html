<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una Sorpresa para Ti</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      text-align: center;
    }
    .container {
      animation: fadeIn 2s ease-in-out;
      padding: 0 20px; /* Add padding for smaller screens */
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    h1, h3 {
      -webkit-text-stroke: 1px #FFD700;
      text-shadow: 0 0 10px #FFD700;
      transition: text-shadow 0.3s;
      color: black;
    }
    h1:hover, h3:hover {
      text-shadow: 0 0 20px #FFD700, 0 0 10px #fff;
    }
    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 4.5rem;
      margin: 0;
    }
    h3 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 40px;
    }
    .button {
      background-color: #FFD700;
      color: black;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s, transform 0.3s;
      font-weight: bold;
    }
    .button:hover {
      background-color: #FFA500;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 3rem;
      }
      h3 {
        font-size: 1.2rem;
      }
      .button {
        font-size: 1rem;
        padding: 12px 24px;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 2.5rem;
      }
      h3 {
        font-size: 1rem;
      }
      .button {
        font-size: 0.9rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HOLA PRECIOSA</h1>
    <h3>Tengo un regalo especial para ti</h3>
    <a href="flores.html" class="button">¡Presiona para ver!</a>
  </div>
</body>
</html>
